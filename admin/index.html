<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý nội dung | Portfolio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap">
  <link rel="stylesheet" href="../site/css/style.css">
  <style>
    body { font-size: 15px; }
    .bar {
      position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }
    .bar-inner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .bar h1 { font-size: 1.1rem; margin: 0 auto 0 0; }
    .status { font-size: .85rem; color: var(--muted); width: 100%; }
    .status.dirty { color: var(--accent); }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 20px 0; }
    .tabs button {
      font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 10px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    fieldset { border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin: 0 0 20px; background: var(--surface); }
    legend { font-weight: 700; padding: 0 8px; }
    .f { margin-bottom: 16px; }
    .f label { display: block; font-weight: 600; margin-bottom: 4px; }
    .f .hint { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
    input[type=text], input[type=url], textarea, select {
      width: 100%; font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
    }
    textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
    textarea.mono { font-family: var(--mono); font-size: .9rem; }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
    .row { display: grid; gap: 10px; grid-template-columns: 140px 1fr; align-items: start; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    .item { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; background: var(--bg); }
    .item-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; font-weight: 600; }
    .small-btn {
      font: inherit; font-size: .85rem; padding: 6px 12px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    .small-btn:hover { border-color: var(--accent); }
    .small-btn.danger { color: var(--bad); }
    .img-pick { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .img-pick img { width: 110px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); }
    .img-pick .path { font-size: .8rem; color: var(--muted); word-break: break-all; }
    .drop { border: 2px dashed var(--border); border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); }
    .drop.over { border-color: var(--accent); color: var(--accent); }
    .notice { background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; font-size: .9rem; margin-top: 16px; }
    .add-row { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="container bar-inner">
      <h1>Quản lý nội dung Portfolio</h1>
      <button class="btn ghost" id="pick-dir" type="button">📁 Chọn thư mục dự án</button>
      <button class="btn" id="save" type="button">💾 Lưu</button>
      <a class="btn ghost" href="../site/index.html" target="_blank" rel="noopener">Xem site ↗</a>
      <div class="status" id="status"></div>
    </div>
  </div>
  <main style="padding-top:0">
    <div class="container">
      <div class="notice" id="mode-notice"></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="panel"></div>
    </div>
  </main>
  <script src="../site/js/data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
